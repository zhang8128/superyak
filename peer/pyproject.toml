[project]
name = "superyak-peer"
version = "0.1.0"
description = "A self-hosted Superyak personal peer"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = ["fastapi>=0.141,<1", "uvicorn>=0.30,<1", "starlette>=1.3,<2", "cryptography>=44"]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "httpx2>=2",
    "playwright==1.62.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# Explicit file selection must not depend on external ignore rules.
ignore-vcs = true

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

# Reviewed release inventories: list individual files, never source directories.
# scripts/source_bundle.py shares the sdist inventory.
[tool.hatch.build.targets.sdist]
only-include = [
    "API.md",
    "LICENSE",
    "MODELS_AND_SOURCES.md",
    "NOTICE",
    "PROTOCOL.md",
    "README.md",
    "hatch_build.py",
    "pyproject.toml",
    "scripts/share_link.py",
    "scripts/source_bundle.py",
    "scripts/two_peer_check.py",
    "systemd/50-alerts.conf",
