[project]
name = "superyak-peer"
version = "0.1.0"
description = "A self-hosted Superyak personal peer"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = ["fastapi>=0.141,<1", "uvicorn>=0.30,<1", "starlette>=1.3,<2", "cryptography>=44"]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "httpx2>=2",
    "playwright==1.62.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["superyak_peer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
