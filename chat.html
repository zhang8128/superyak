<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>engram</title>
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --border: #2a2a2a;
    --text: #e0e0e0;
    --text-dim: #666;
    --accent: #7b9;
    --core: #b97;
    --claude: #79b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  header h1 { font-size: 16px; font-weight: 600; letter-spacing: 0.5px; }
  #status {
    font-size: 11px;
    color: var(--text-dim);
    cursor: pointer;
  }
  #status.connected { color: var(--accent); }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    -webkit-overflow-scrolling: touch;
  }
  .msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 15px;
    line-height: 1.45;
    word-wrap: break-word;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: #1a3a2a;
    border-bottom-right-radius: 4px;
  }
  .msg.agent {
    align-self: flex-start;
    background: var(--surface);
    border-bottom-left-radius: 4px;
  }
  .msg.system {
    align-self: center;
    background: none;
    color: var(--text-dim);
    font-size: 12px;
    padding: 4px 8px;
  }
  .msg .meta {
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .msg .remembered {
    margin-top: 6px;
    padding: 4px 8px;
    background: rgba(119,187,153,0.1);
    border-left: 2px solid var(--accent);
    font-size: 12px;
    color: var(--text-dim);
    border-radius: 0 4px 4px 0;
  }
  .msg .remembered.core {
    border-left-color: var(--core);
    background: rgba(187,153,119,0.1);
  }
  #input-area {
    padding: 8px 12px;
    padding-bottom: max(8px, env(safe-area-inset-bottom));
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
    flex-shrink: 0;
    background: var(--bg);
  }
  #input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--surface);
    color: var(--text);
    font-size: 15px;
    outline: none;
    resize: none;
    max-height: 120px;
    line-height: 1.4;
  }
  #input:focus { border-color: var(--accent); }
  #input::placeholder { color: var(--text-dim); }
  #send {
    padding: 10px 16px;
    border: none;
    border-radius: 20px;
    background: var(--accent);
    color: var(--bg);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
    align-self: flex-end;
  }
  #send:disabled { opacity: 0.3; cursor: default; }
  #send:active:not(:disabled) { opacity: 0.8; }

  /* Commands bar */
  #commands {
    padding: 6px 16px;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    flex-shrink: 0;
    -webkit-overflow-scrolling: touch;
  }
  .cmd {
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 12px;
    color: var(--text-dim);
    cursor: pointer;
    white-space: nowrap;
    background: none;
  }
  .cmd:active { background: var(--surface); }

  .typing {
    color: var(--text-dim);
    font-style: italic;
    white-space: pre-line;
    font-size: 13px;
  }
</style>
</head>
<body>

<header>
  <h1>engram</h1>
  <span id="status" onclick="checkStatus()">connecting...</span>
</header>

<div id="commands">
  <button class="cmd" onclick="sendCmd('/status')">status</button>
  <button class="cmd" onclick="sendCmd('/core')">core</button>
  <button class="cmd" onclick="sendCmd('/recall')">recall</button>
  <button class="cmd" onclick="sendCmd('/instincts')">instincts</button>
</div>

<div id="messages"></div>

<div id="input-area">
  <textarea id="input" rows="1" placeholder="say something..."
    onkeydown="handleKey(event)" oninput="autoGrow(this)"></textarea>
  <button id="send" onclick="send()">send</button>
</div>

<script>
const API = location.origin;
const messages = document.getElementById('messages');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const statusEl = document.getElementById('status');

let busy = false;

function addMsg(text, role, extra) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.textContent = text;
  if (extra) {
    const e = document.createElement('div');
    e.className = extra.cls || '';
    e.textContent = extra.text;
    div.appendChild(e);
  }
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
  return div;
}

function autoGrow(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
}

async function send() {
  const text = input.value.trim();
  if (!text || busy) return;

  input.value = '';
  input.style.height = 'auto';
  addMsg(text, 'user');

  busy = true;
  sendBtn.disabled = true;
  const typing = addMsg('thinking...', 'agent typing');

  // Poll Claude status while waiting
  let pollTimer = setInterval(async () => {
    try {
      const sr = await fetch(`${API}/claude-status`, {signal: AbortSignal.timeout(2000)});
      const cs = await sr.json();
      if (cs.state && cs.state !== 'idle' && cs.state !== 'done') {
        typing.textContent = `claude: ${cs.state}` +
          (cs.steps.length ? `\n${cs.steps.slice(-3).join('\n')}` : '');
      }
    } catch(e) {}
  }, 1500);

  try {
    const res = await fetch(`${API}/chat`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text}),
    });
    const data = await res.json();

    clearInterval(pollTimer);
    typing.remove();

    if (data.error) {
      addMsg(data.error, 'system');
    } else {
      // Strip <remember> tags from display, show them as annotations
      let response = data.response || '';
      const remembers = [];
      response = response.replace(/<remember\s*(core)?>([\s\S]*?)<\/remember>/g,
        (_, core, content) => {
          remembers.push({core: !!core, content: content.trim()});
          return '';
        });

      // Strip think blocks
      response = response.replace(/<think>[\s\S]*?<\/think>/g, '').trim();
      if (response.includes('</think>')) {
        response = response.split('</think>').pop().trim();
      }

      const msgEl = addMsg(response, 'agent');

      for (const r of remembers) {
        const re = document.createElement('div');
        re.className = `remembered ${r.core ? 'core' : ''}`;
        re.textContent = (r.core ? '[CORE] ' : '') + r.content.slice(0, 120);
        msgEl.appendChild(re);
      }
    }
  } catch (e) {
    clearInterval(pollTimer);
    typing.remove();
    addMsg(`connection error: ${e.message}`, 'system');
  }

  busy = false;
  sendBtn.disabled = false;
  input.focus();
}

async function sendCmd(cmd) {
  if (cmd === '/status') {
    try {
      const res = await fetch(`${API}/status`);
      const data = await res.json();
      const lines = Object.entries(data).map(([k,v]) => `${k}: ${v}`).join('\n');
      addMsg(lines, 'system');
    } catch(e) { addMsg('not connected', 'system'); }
  } else if (cmd === '/core') {
    try {
      const res = await fetch(`${API}/core`);
      const data = await res.json();
      addMsg(`${data.count} core memories`, 'system');
      for (const ep of (data.episodes || []).slice(0, 5)) {
        const src = ep.source ? ` [${ep.source}]` : '';
        addMsg(ep.content.slice(0, 200) + '...', 'system');
      }
    } catch(e) { addMsg('not connected', 'system'); }
  } else if (cmd === '/recall') {
    const q = prompt('Search memories:');
    if (!q) return;
    addMsg(`recalling: ${q}`, 'user');
    try {
      const res = await fetch(`${API}/recall?q=${encodeURIComponent(q)}`);
      const data = await res.json();
      for (const r of (data.results || []).slice(0, 5)) {
        const core = r.core ? ' [CORE]' : '';
        addMsg(`${r.score.toFixed(3)} ${r.layer}${core}\n${r.content.slice(0, 150)}`, 'system');
      }
    } catch(e) { addMsg('not connected', 'system'); }
  } else if (cmd === '/instincts') {
    try {
      const res = await fetch(`${API}/instincts`);
      const data = await res.json();
      for (const inst of data.instincts || []) {
        addMsg(`[${inst.trigger}] ${inst.action.slice(0, 120)}`, 'system');
      }
    } catch(e) { addMsg('not connected', 'system'); }
  }
}

async function checkStatus() {
  try {
    const res = await fetch(`${API}/health`, {signal: AbortSignal.timeout(3000)});
    const data = await res.json();
    statusEl.textContent = `${data.model.split(':')[0]} · ${data.session_id}`;
    statusEl.className = 'connected';
  } catch(e) {
    statusEl.textContent = 'disconnected';
    statusEl.className = '';
  }
}

// Init
checkStatus();
setInterval(checkStatus, 30000);
input.focus();
</script>
</body>
</html>
