# Drop-in for superyak-embedder.service on the Pi (smart), the station: always on, so it keeps the embedding model
# loaded and loads it at start. A lighthouse crossing's asker gives up after about 1 s and a reload takes 2-3 s, so a
# dropped or not-yet-loaded model made the first crossing after a quiet spell always expire (2026-11-09).
# Not for laptops or Tardis: they keep the 300 s idle drop. Install with `make embedder-keep-loaded`.
[Service]
Environment=ENGRAM_EMBED_IDLE_SECONDS=0
