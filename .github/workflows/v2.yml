name: v2 checks

# Stage 1 plan, task 0: fmt, clippy and the tests under v2/, on x86_64 Linux and arm64 macOS, for pushes that touch
# v2/**. The toolchain is v2/rust-toolchain.toml's (1.100.0, with rustfmt and clippy), installed by the runner's own
# rustup: no third-party action. CI has the network, so it doesn't use v2/scripts/offline.sh.

on:
  push:
    paths: ["v2/**", ".github/workflows/v2.yml"]
  pull_request:
    paths: ["v2/**", ".github/workflows/v2.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v2:
    name: v2 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustc --version && cargo --version
      - name: The jail's tools (Linux)
        # The room jails a worker and its check with bubblewrap on Linux. Ubuntu's runners restrict unprivileged user
        # namespaces through AppArmor, which bwrap needs, so that restriction is lifted for the job.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --version
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        if: success() || failure()  # each of the three reports, though one fails
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Binaries
        # cargo test leaves bins in the build dir; only cargo build puts yak in target/debug, where the suite finds it.
        if: success() || failure()
        run: cargo build --workspace --bins --locked
      - name: Every test, the ones that need the room and the acceptance suite with them
        # A plain cargo test leaves out the tests that need the room, each with a line that says so, and the
        # acceptance suite. Here the room can run, so every test is asked for, and the guard fails the step if
        # one was left out all the same, or if a test program that the list names was not started.
        if: success() || failure()
        run: bash scripts/whole-suite.sh "$RUNNER_TEMP/suite.log"
      - name: The scripts' own tests
        # The guard over the whole suite, and the probe of a plain cargo test with its checks, each tried with a
        # script standing in for cargo; the scripts that run the pilot's turns and read what they leave, tried on
        # records made by hand; and the program that makes items from merged commits, with its check, tried on
        # small repositories it makes, with a module standing in for pytest; and the merged-item pilot drivers,
        # with a script standing in for yak: no model, no clock, no room.
        if: success() || failure()
        run: |
          status=0
          python3 -I scripts/test_suite_guard.py || status=1
          python3 -I probes/tests/test_probe.py || status=1
          python3 -I probes/pilot/test_records.py || status=1
          python3 -I probes/items/test_items.py || status=1
          python3 -I probes/items/test_pilot.py || status=1
          exit "$status"
      - name: The first run's three checks
        # The frozen checks of the first run with model workers. Its items are done, so the checks are regression
        # checks now: each builds yak offline from this checkout and drives `yak item add` from outside. They want
        # a folder of vendored crates, which is made here, and a place for temporary files.
        if: success() || failure()
        working-directory: .
        run: |
          (cd v2 && cargo vendor --locked "$RUNNER_TEMP/vendor" > /dev/null)
          # Each of the three reports, though one fails: the loop does not end at the first failure.
          status=0
          for check in item-add-wrong-commit item-add-check-freezable item-add-title; do
            TMPDIR="$RUNNER_TEMP" sh "v2/checks/$check.sh" "$RUNNER_TEMP/vendor" || status=1
          done
          exit "$status"
