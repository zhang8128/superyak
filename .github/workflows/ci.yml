name: Monorepo checks

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  peer:
    name: Standalone peer, browser, and package checks
    # Pinned to 24.04, the faster runner: in one paired run on 11-24 (45453286248, one commit) the peer suite took 42:23
    # on 24.04.5 and 46:04 on 26.04.1. Both had 4 cores, 15 GiB, kernel 7.0 azure and Python 3.13.5. The 9% was spread
    # per test (CPU-bound tests 25-40% slower, timer waits the same), so it's the image or the host drawn, not a test.
    # The gap was about 50% in November's first runs (35:48 and 36:52 against 23:47). This is the longest job, and on
    # 26.04 it would leave 14 of its 60 minutes. Unpin when 24.04's retirement is announced, or a second pair shows the
    # gap gone (board ci:peer-job-slower-on-ubuntu-26).
    runs-on: ubuntu-24.04
    timeout-minutes: 60  # 15 cut the suite at 15m18s on 7d46e2b6; 35 cut it at 96% with 0 failures on 16c41c76, after a slow apt mirror; 45 cut the job on 728b0f64 just after 3,705 passed in 44m20s. Green runs took 24.3, 29.4 and 29.6 min early on; the suite alone took 44.3 min on 728b0f64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.8.3"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: |
            peer/uv.lock
            engram/uv.lock
      - run: make setup-peer
      # The imprint end-to-end and throwaway tests drive engram's own CLI, which needs its dev extras: without them
      # they fail here as in any fresh worktree. They're the imprint path end to end, so they run, not skip.
      - run: make setup-engram
      - run: uv run --locked --project peer playwright install --with-deps chromium
      # The suite's temp in RAM: on Tardis at 8eff27e0 it took 3 h 13 min with its temp on disk, and reached 82% in about 29 min
      # with it on tmpfs, so there it waits on disk syncs. pytest keeps every test's dir until the session ends, which
      # filled the Pi's 8 GB /dev/shm and failed the imprint route's 4 GiB free floor, so only a failed test's dir is kept.
      # A browser test that fails inside signed_in_browser or signed_out_browser leaves each open page's screenshot and
      # visible text, and its console's lines, under SUPERYAK_TEST_ARTIFACTS (test_browser.py, _evidence_on_failure);
      # a failed or timed-out run uploads them, beside the few screenshots passing tests take there. Throwaway test homes
      # only (keys made per test), and no trace, since a trace would hold session cookies and the upload is public for 7
      # days (run 45646287391's "not stable" left nothing to read; all hands c30e9df1).
      - run: mkdir -p "$TMPDIR" "$SUPERYAK_TEST_ARTIFACTS" && df -h /dev/shm && make check-peer && df -h /dev/shm
        env:
          TMPDIR: /dev/shm/peer-tmp
          PYTEST_ADDOPTS: --basetemp=/dev/shm/pytest-peer -o tmp_path_retention_policy=failed
          SUPERYAK_TEST_ARTIFACTS: ${{ runner.temp }}/browser-evidence
      - if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-evidence
          path: ${{ runner.temp }}/browser-evidence
          retention-days: 7
          if-no-files-found: ignore

  atlas:
    name: Atlas workbench tests and offline demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.8.3"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: atlas/uv.lock
      - run: make setup-atlas
      - run: make check-atlas
      - run: make atlas-demo
      - run: make atlas ATLAS_ARGS='context q-fate'

  engram:
    name: Engram and portable research tests
    runs-on: ubuntu-latest
    timeout-minutes: 45  # check-engram took 23.3 min of 30 on 4158fc61, and a run was cancelled at 30 on dc555ba7 with the same Engram code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.8.3"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: engram/uv.lock
      # The embedding model lives in ~/.kairos/models/fastembed (engram/embeddings.py, _CACHE_DIR). Uncached, every run
      # downloaded it, and a slow or broken download failed tests that are not about it: 10 test_embeddings tests at once in
      # one v2 run, and main's 22:00 red on 11-21 (an ONNX model cache error, green on rerun). The key follows the code that
      # names the model and the locked fastembed, so a change to either downloads afresh.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.kairos/models/fastembed
          key: fastembed-${{ runner.os }}-${{ hashFiles('engram/embeddings.py', 'engram/uv.lock') }}
      - run: make setup-engram
      - run: make check-engram
      - run: make check-research-tasks

  lighthouse:
    name: Lighthouse and interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "11.20.0"
          package_json_file: lighthouse/package.json
          cache: true
          cache_dependency_path: lighthouse/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.8.3"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: engram/uv.lock
      - run: make setup
      - run: make check-lighthouse
      - run: make check-integration

  sessions:
    name: Codex session delivery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.8.3"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: engram/uv.lock
      - run: npm install --global @openai/codex@0.153.4
      - run: make setup-engram
      - run: uv run --locked --extra dev python -m pytest tests/test_session_bridge.py tests/test_session_cli.py tests/test_session_delivery.py -q -ra --tb=short
        working-directory: engram

  team:
    name: Team mode (mock agents, no network)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.8.3"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: team/uv.lock
      - run: make setup-team
      - run: make check-team
      # The pre-push hook's bytes reading exists for macOS's grep, and this is the only job that runs there.
      - run: uv run --locked --project agent --extra dev pytest agent/tests/test_prepush_hook.py -q
      - run: uv build --project team --out-dir /tmp/superyak-team-dist

  agent:
    name: Ships (station client, watcher, docking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.8.3"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: agent/uv.lock
      - run: make setup-agent
      - run: make check-agent

  tuning:
    name: Clinical and biotech data, evaluation, and CPU LoRA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.8.3"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: tuning/uv.lock
      - run: make setup-tuning
      - run: make check-tuning
      - run: uv build --project tuning --out-dir /tmp/superyak-tuning-dist
