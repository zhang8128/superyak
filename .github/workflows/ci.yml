name: Monorepo checks

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  peer:
    name: Standalone peer, browser, and package checks
    runs-on: ubuntu-latest
    timeout-minutes: 60  # 15 cut the suite at 15m18s on 7d46e2b6; 35 cut it at 96% with 0 failures on 16c41c76, after a slow apt mirror; 45 cut the job on 728b0f64 just after 3,705 passed in 44m20s. Green runs took 24.3, 29.4 and 29.6 min early on; the suite alone took 44.3 min on 728b0f64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.8.3"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: |
            peer/uv.lock
            engram/uv.lock
      - run: make setup-peer
      # The imprint end-to-end and throwaway tests drive engram's own CLI, which needs its dev extras: without them
      # they fail here as in any fresh worktree. They're the imprint path end to end, so they run, not skip.
      - run: make setup-engram
      - run: uv run --locked --project peer playwright install --with-deps chromium
      - run: make check-peer

  atlas:
    name: Atlas workbench tests and offline demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.8.3"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: atlas/uv.lock
      - run: make setup-atlas
      - run: make check-atlas
      - run: make atlas-demo
      - run: make atlas ATLAS_ARGS='context q-fate'

  engram:
    name: Engram and portable research tests
    runs-on: ubuntu-latest
    timeout-minutes: 45  # check-engram took 23.3 min of 30 on 4158fc61, and a run was cancelled at 30 on dc555ba7 with the same Engram code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.8.3"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: engram/uv.lock
      - run: make setup-engram
      - run: make check-engram
      - run: make check-research-tasks

  lighthouse:
    name: Lighthouse and interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "11.20.0"
          package_json_file: lighthouse/package.json
          cache: true
          cache_dependency_path: lighthouse/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.8.3"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: engram/uv.lock
      - run: make setup
      - run: make check-lighthouse
      - run: make check-integration

  sessions:
    name: Codex session delivery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.8.3"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: engram/uv.lock
      - run: npm install --global @openai/codex@0.153.4
      - run: make setup-engram
      - run: uv run --locked --extra dev python -m pytest tests/test_session_bridge.py tests/test_session_cli.py tests/test_session_delivery.py -q -ra --tb=short
        working-directory: engram

  team:
    name: Team mode (mock agents, no network)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.8.3"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: team/uv.lock
      - run: make setup-team
      - run: make check-team
      # The pre-push hook's bytes reading exists for macOS's grep, and this is the only job that runs there.
      - run: uv run --locked --project agent --extra dev pytest agent/tests/test_prepush_hook.py -q
      - run: uv build --project team --out-dir /tmp/superyak-team-dist

  agent:
    name: Ships (station client, watcher, docking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.8.3"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: agent/uv.lock
      - run: make setup-agent
      - run: make check-agent

  tuning:
    name: Clinical and biotech data, evaluation, and CPU LoRA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.8.3"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: tuning/uv.lock
      - run: make setup-tuning
      - run: make check-tuning
      - run: uv build --project tuning --out-dir /tmp/superyak-tuning-dist
