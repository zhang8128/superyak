name: Monorepo checks

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engram:
    name: Engram tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.8.3"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: engram/uv.lock
      - run: make setup-engram
      - run: make check-engram

  lighthouse:
    name: Lighthouse and interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "11.20.0"
          package_json_file: lighthouse/package.json
          cache: true
          cache_dependency_path: lighthouse/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.8.3"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: engram/uv.lock
      - run: make setup
      - run: make check-lighthouse
      - run: make check-integration

  sessions:
    name: Codex session delivery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.8.3"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: engram/uv.lock
      - run: npm install --global @openai/codex@0.153.4
      - run: make setup-engram
      - run: uv run --locked --extra dev python -m pytest tests/test_session_bridge.py tests/test_session_cli.py tests/test_session_delivery.py -q -ra --tb=short
        working-directory: engram
