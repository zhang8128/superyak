name: Monorepo checks

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  peer:
    name: Standalone peer, browser, and package checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.8.3"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: peer/uv.lock
      - run: make setup-peer
      - run: uv run --locked --project peer playwright install --with-deps chromium
      - run: make check-peer

  atlas:
    name: Atlas workbench tests and offline demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.8.3"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: atlas/uv.lock
      - run: make setup-atlas
      - run: make check-atlas
      - run: make atlas-demo
      - run: make atlas ATLAS_ARGS='context q-fate'

  engram:
    name: Engram and portable research tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.8.3"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: engram/uv.lock
      - run: make setup-engram
      - run: make check-engram
      - run: make check-research-tasks

  lighthouse:
    name: Lighthouse and interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "11.20.0"
          package_json_file: lighthouse/package.json
          cache: true
          cache_dependency_path: lighthouse/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.8.3"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: engram/uv.lock
      - run: make setup
      - run: make check-lighthouse
      - run: make check-integration

  sessions:
    name: Codex session delivery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.8.3"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: engram/uv.lock
      - run: npm install --global @openai/codex@0.153.4
      - run: make setup-engram
      - run: uv run --locked --extra dev python -m pytest tests/test_session_bridge.py tests/test_session_cli.py tests/test_session_delivery.py -q -ra --tb=short
        working-directory: engram

  team:
    name: Team mode (mock agents, no network, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.8.3"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: team/uv.lock
      - run: make setup-team
      - run: make check-team
      - run: uv build --project team --out-dir /tmp/superyak-team-dist

  agent:
    name: Ships (station client, watcher, docking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.8.3"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: agent/uv.lock
      - run: make setup-agent
      - run: make check-agent

  tuning:
    name: Clinical and biotech data, evaluation, and CPU LoRA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.8.3"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: tuning/uv.lock
      - run: make setup-tuning
      - run: make check-tuning
      - run: uv build --project tuning --out-dir /tmp/superyak-tuning-dist
