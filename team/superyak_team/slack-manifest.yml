display_information:
  name: Superyak Team
  description: Superyak team mode — the lead and its Codex/Claude workers report and take direction here.
  background_color: "#2c3e50"
features:
  bot_user:
    display_name: superyak-team
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - chat:write.customize
      - channels:history
      - channels:read
      - groups:history
      - groups:read
      - canvases:write
      - files:read
      - reactions:write
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
