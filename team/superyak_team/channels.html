<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Superyak Channels</title>
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a64; --line: #e3e1d9;
  --accent: #1f6f78; --accent-ink: #ffffff; --human: #fff4dc; --plan: #eef4f4; --err: #a33;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141513; --panel: #1d1f1c; --ink: #ecebe6; --muted: #9a998f; --line: #2e302c;
    --accent: #5fb3bb; --accent-ink: #0d1716; --human: #2f2a1c; --plan: #1b2a2b; --err: #e88;
  }
}
:root[data-theme="dark"] {
  --bg: #141513; --panel: #1d1f1c; --ink: #ecebe6; --muted: #9a998f; --line: #2e302c;
  --accent: #5fb3bb; --accent-ink: #0d1716; --human: #2f2a1c; --plan: #1b2a2b; --err: #e88;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
       display: flex; flex-direction: column; }
header { display: flex; gap: 8px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line);
         background: var(--panel); position: sticky; top: 0; }
header h1 { font-size: 15px; margin: 0; font-weight: 600; white-space: nowrap; }
select { flex: 1; min-width: 0; font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px;
         background: var(--bg); color: var(--ink); }
#log { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
.msg { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; max-width: 760px; }
.msg.human { background: var(--human); align-self: flex-end; }
.msg.plan { background: var(--plan); }
.meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; }
.meta b { color: var(--ink); font-weight: 600; }
.body { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 2px; }
details summary { cursor: pointer; font-weight: 600; margin-top: 2px; }
form { display: flex; gap: 8px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line);
       background: var(--panel); }
#login input { flex: 1; min-width: 0; font: inherit; padding: 8px 10px; border: 1px solid var(--line);
               border-radius: 8px; background: var(--bg); color: var(--ink); }
textarea { flex: 1; min-width: 0; font: inherit; resize: none; padding: 8px 10px; border: 1px solid var(--line);
           border-radius: 8px; background: var(--bg); color: var(--ink); max-height: 40vh; }
button { font: inherit; font-weight: 600; padding: 8px 14px; border: 0; border-radius: 8px; background: var(--accent);
         color: var(--accent-ink); }
button:disabled { opacity: .5; }
.hint { font-size: 12px; color: var(--muted); padding: 0 16px 6px; background: var(--panel); }
.empty, .error { color: var(--muted); text-align: center; margin-top: 20vh; }
.error { color: var(--err); }
</style>
</head>
<body>
<header>
  <h1>Superyak</h1>
  <select id="channel" aria-label="Channel"></select>
</header>
<div id="status" class="hint" role="status"></div>
<form id="login" hidden>
  <input id="code" type="password" autocomplete="off" placeholder="Access code (the part after #t=)" aria-label="Access code">
  <button type="submit">Open</button>
</form>
<main id="log" aria-live="polite"><p class="empty">Loading…</p></main>
<div class="hint">@lead, @w2 or @all in a team channel reaches that agent.</div>
<form id="send">
  <textarea id="text" rows="1" placeholder="Message" aria-label="Message"></textarea>
  <button id="go" type="submit">Send</button>
</form>
<script>
(function () {
  var token = null;
  var m = location.hash.match(/[#&]t=([^&]+)/);
  if (m) {
    token = decodeURIComponent(m[1]);
    try { localStorage.setItem("sy-token", token); } catch (e) {}
    history.replaceState(null, "", location.pathname);
  } else {
    try { token = localStorage.getItem("sy-token"); } catch (e) {}
  }
  var sel = document.getElementById("channel"), log = document.getElementById("log");
  var form = document.getElementById("send"), text = document.getElementById("text");
  var current = null, lastId = 0, me = "";
  try { current = localStorage.getItem("sy-channel"); } catch (e) {}

  function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({"Authorization": "Bearer " + token}, opts.headers || {});
    return fetch(path, opts).then(function (r) {
      if (r.status === 401) { needLogin("That access code didn't work; paste it again."); throw new Error("unauthorized"); }
      return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || r.status); return j; });
    });
  }
  var status = document.getElementById("status"), login = document.getElementById("login");
  function say(msg) { status.textContent = msg; }
  function needLogin(msg) {
    login.hidden = false; say(msg || "Enter your access code.");
    try { localStorage.removeItem("sy-token"); } catch (e) {}
  }
  login.addEventListener("submit", function (e) {
    e.preventDefault();
    token = document.getElementById("code").value.trim().replace(/^.*#t=/, "");
    if (!token) return;
    try { localStorage.setItem("sy-token", token); } catch (e) {}
    login.hidden = true; start();
  });
  function fail(msg) { log.innerHTML = ""; var p = document.createElement("p"); p.className = "error"; p.textContent = msg; log.appendChild(p); }
  function when(ts) { var d = new Date(ts * 1000); return d.toLocaleString([], {month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"}); }

  function render(r) {
    var div = document.createElement("div");
    div.className = "msg " + r.kind;
    var meta = document.createElement("div"); meta.className = "meta";
    var who = document.createElement("b"); who.textContent = r.from;
    var t = document.createElement("span"); t.textContent = when(r.ts);
    meta.appendChild(who); meta.appendChild(t); div.appendChild(meta);
    var body = document.createElement("div"); body.className = "body"; body.textContent = r.text;
    if (r.kind === "plan") {
      var d = document.createElement("details"), s = document.createElement("summary");
      s.textContent = "Plan: " + (r.title || "untitled"); d.appendChild(s); d.appendChild(body); div.appendChild(d);
    } else { div.appendChild(body); }
    return div;
  }

  function loadChannels() {
    return api("/api/channels").then(function (j) {
      me = j.me;
      var names = j.channels.map(function (c) { return c.channel; });
      if (!current || names.indexOf(current) < 0) current = names[0];
      say(names.length + " channel" + (names.length === 1 ? "" : "s") + " · signed in as " + me);
      sel.innerHTML = "";
      j.channels.forEach(function (c) {
        var o = document.createElement("option"); o.value = c.channel;
        o.textContent = "#" + c.channel + (c.messages ? " (" + c.messages + ")" : "");
        if (c.channel === current) o.selected = true; sel.appendChild(o);
      });
    });
  }

  function poll() {
    if (!current) return Promise.resolve();
    var ch = current;
    return api("/api/read?channel=" + encodeURIComponent(ch) + "&after=" + lastId + "&limit=200").then(function (j) {
      if (ch !== current) return;
      if (lastId === 0) log.innerHTML = j.messages.length ? "" : '<p class="empty">No messages yet.</p>';
      if (!j.messages.length) return;
      var atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
      j.messages.forEach(function (r) { log.appendChild(render(r)); lastId = r.id; });
      if (atBottom || j.messages.some(function (r) { return r.kind === "human"; })) log.scrollTop = log.scrollHeight;
    });
  }

  function switchTo(ch) {
    current = ch; lastId = 0;
    try { localStorage.setItem("sy-channel", ch); } catch (e) {}
    log.innerHTML = '<p class="empty">Loading…</p>';
    poll().catch(function (e) { fail(e.message); });
  }

  sel.addEventListener("change", function () { switchTo(sel.value); });
  text.addEventListener("input", function () { text.style.height = "auto"; text.style.height = text.scrollHeight + "px"; });
  text.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey && !("ontouchstart" in window)) { e.preventDefault(); form.requestSubmit(); }
  });
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var body = text.value.trim(); if (!body || !current) return;
    var go = document.getElementById("go"); go.disabled = true;
    api("/api/post", {method: "POST", headers: {"Content-Type": "application/json"},
                      body: JSON.stringify({channel: current, text: body})})
      .then(function () { text.value = ""; text.style.height = "auto"; return poll(); })
      .catch(function (e) { alert(e.message); })
      .then(function () { go.disabled = false; });
  });

  var timers = [];
  function start() {
    timers.forEach(clearInterval);
    say("Connecting…");
    loadChannels().then(function () { switchTo(current); })
      .catch(function (e) { if (e.message !== "unauthorized") fail("Couldn't load channels: " + e.message); });
    timers = [setInterval(function () { poll().catch(function () {}); }, 3000),
              setInterval(function () { loadChannels().catch(function () {}); }, 30000)];
  }
  if (!token) { log.innerHTML = ""; needLogin(); return; }
  start();
})();
</script>
</body>
</html>
