[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "superyak-tuning"
version = "0.1.0"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
description = "Clinical and biotech dataset, evaluation, and adapter training tools"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
train = ["torch==2.14.0", "transformers==5.17.0", "peft==0.20.0", "gguf>=0.17", "huggingface-hub>=1.0", "safetensors>=0.6"]
xpu = ["triton-xpu>=3.8.0,<3.9.dev0; sys_platform == 'linux'", "torch==2.14.0", "transformers==5.17.0", "peft==0.20.0", "gguf>=0.17", "huggingface-hub>=1.0", "safetensors>=0.6"]
dev = ["pytest>=8"]

[project.scripts]
superyak-tuning = "superyak_tuning.__main__:main"

[tool.hatch.build.targets.wheel]
only-include = [
    "superyak_tuning/__init__.py",
    "superyak_tuning/__main__.py",
    "superyak_tuning/data.py",
    "superyak_tuning/evaluation.py",
    "superyak_tuning/models.py",
    "superyak_tuning/serving.py",
    "superyak_tuning/trainer.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
conflicts = [[{ extra = "train" }, { extra = "xpu" }]]

[tool.uv.sources]
triton-xpu = { index = "pytorch-xpu", marker = "sys_platform == 'linux'" }
torch = [
  { index = "pytorch-cpu", extra = "train", marker = "sys_platform == 'linux'" },
  { index = "pytorch-xpu", extra = "xpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[tool.hatch.build.targets.sdist]
only-include = [
    "LICENSE",
    "README.md",
    "examples/clinical-biotech-cases.json",
    "examples/clinical-biotech-dataset.json",
    "hatch_build.py",
    "pyproject.toml",
    "superyak_tuning/__init__.py",
    "superyak_tuning/__main__.py",
    "superyak_tuning/data.py",
    "superyak_tuning/evaluation.py",
    "superyak_tuning/models.py",
    "superyak_tuning/serving.py",
    "superyak_tuning/trainer.py",
    "tests/test_cli.py",
    "tests/test_data.py",
    "tests/test_evaluation.py",
    "tests/test_models.py",
    "tests/test_packaging.py",
    "tests/test_serving.py",
    "tests/test_trainer.py",
    "uv.lock",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
