[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "superyak-tuning"
version = "0.1.0"
description = "Clinical and biotech dataset, evaluation, and adapter training tools"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
train = ["torch==2.14.0", "transformers==5.17.0", "peft==0.20.0", "gguf>=0.17", "huggingface-hub>=1.0", "safetensors>=0.6"]
dev = ["pytest>=8"]

[project.scripts]
superyak-tuning = "superyak_tuning.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["superyak_tuning"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
