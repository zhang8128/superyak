<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">Superyak</title>
  <desc id="d">A shaggy yak hero in sunglasses, a red cape billowing behind it, with a gold diamond and a red Y on its chest.</desc>
  <defs>
    <radialGradient id="sky" cx="40%" cy="30%" r="80%">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.55" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </radialGradient>
    <linearGradient id="cape" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset="0.5" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b4226"/>
      <stop offset="1" stop-color="#3b2416"/>
    </linearGradient>
    <linearGradient id="horn" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e7d6ad"/>
      <stop offset="1" stop-color="#fffaf0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef08a"/>
      <stop offset="0.5" stop-color="#facc15"/>
      <stop offset="1" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <clipPath id="badge"><circle cx="256" cy="256" r="244"/></clipPath>
  </defs>

  <!-- badge -->
  <circle cx="256" cy="256" r="248" fill="#0f172a"/>
  <circle cx="256" cy="256" r="244" fill="url(#sky)"/>

  <g clip-path="url(#badge)">
    <!-- clouds and speed lines -->
    <g fill="#ffffff" opacity="0.35">
      <ellipse cx="96" cy="118" rx="46" ry="14"/>
      <ellipse cx="122" cy="106" rx="30" ry="14"/>
      <ellipse cx="420" cy="430" rx="54" ry="13"/>
    </g>
    <g stroke="#ffffff" stroke-linecap="round" opacity="0.6" fill="none">
      <path d="M40 300 H120" stroke-width="7"/>
      <path d="M28 336 H100" stroke-width="5"/>
      <path d="M52 372 H124" stroke-width="6"/>
    </g>
    <!-- sparkles -->
    <g fill="#fffbeb">
      <path d="M418 92 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z"/>
      <path d="M80 214 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/>
      <path d="M452 168 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/>
    </g>

    <!-- cape, billowing right -->
    <g stroke="#7f1d1d" stroke-width="5" stroke-linejoin="round">
      <path d="M180 262 C150 300 132 352 150 410 C168 404 182 392 196 386 Z" fill="#b91c1c"/>
      <path d="M318 248 C368 226 404 168 476 150 C470 182 506 206 486 238 C470 262 504 284 480 312
               C462 334 490 362 458 386 C432 404 446 432 404 438 C380 442 370 420 346 428 L318 362 Z" fill="url(#cape)"/>
    </g>
    <g stroke="#991b1b" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8">
      <path d="M338 256 C384 236 420 200 462 180"/>
      <path d="M340 296 C390 290 430 262 470 256"/>
      <path d="M340 336 C384 340 420 330 458 336"/>
      <path d="M338 372 C372 386 400 392 430 404"/>
    </g>

    <!-- hooves -->
    <g stroke="#1f130b" stroke-width="4">
      <rect x="206" y="440" width="34" height="34" rx="6" fill="#3b2416"/>
      <rect x="272" y="440" width="34" height="34" rx="6" fill="#3b2416"/>
      <path d="M204 472 h38 v14 a6 6 0 0 1 -6 6 h-26 a6 6 0 0 1 -6 -6z" fill="#9ca3af"/>
      <path d="M270 472 h38 v14 a6 6 0 0 1 -6 6 h-26 a6 6 0 0 1 -6 -6z" fill="#9ca3af"/>
    </g>

    <!-- shaggy body with fringe -->
    <path d="M160 300 C160 262 200 240 256 240 C312 240 352 262 352 300
             L362 330 L372 362 L362 392 L370 420 L350 412 L340 446 L322 424 L306 456 L290 428 L274 460
             L256 430 L238 460 L222 428 L206 456 L190 424 L172 446 L162 412 L142 420 L150 392 L140 362 L150 330 Z"
          fill="url(#fur)" stroke="#1f130b" stroke-width="5" stroke-linejoin="round"/>
    <g stroke="#2a190f" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7">
      <path d="M176 340 l-6 34"/><path d="M190 364 l-4 32"/><path d="M330 340 l6 34"/><path d="M318 364 l4 32"/>
    </g>

    <!-- the diamond Y -->
    <g>
      <path d="M216 300 H296 L320 324 L256 392 L192 324 Z" fill="url(#gold)" stroke="#b91c1c" stroke-width="6" stroke-linejoin="round"/>
      <path d="M226 310 L247 310 L256 327 L265 310 L286 310 L264 345 L264 374 L248 374 L248 345 Z"
            fill="#dc2626" stroke="#7f1d1d" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M222 306 H252" stroke="#fffbeb" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    </g>

    <!-- horns -->
    <g stroke="#8a7a55" stroke-width="5" stroke-linejoin="round">
      <path d="M196 160 C160 156 128 132 124 92 C122 74 132 58 146 52 C142 74 150 104 186 122 Z" fill="url(#horn)"/>
      <path d="M316 160 C352 156 384 132 388 92 C390 74 380 58 366 52 C370 74 362 104 326 122 Z" fill="url(#horn)"/>
    </g>

    <!-- ears -->
    <g fill="#5a3622" stroke="#1f130b" stroke-width="5">
      <ellipse cx="170" cy="190" rx="26" ry="13" transform="rotate(-18 170 190)"/>
      <ellipse cx="342" cy="190" rx="26" ry="13" transform="rotate(18 342 190)"/>
    </g>

    <!-- yak hair hanging past the face, and a chin beard -->
    <g fill="#4a2c17" stroke="#1f130b" stroke-width="4.5" stroke-linejoin="round">
      <path d="M192 186 L166 228 L178 232 L156 268 L176 262 L164 300 L190 276 L196 296 L208 262 L204 228 Z"/>
      <path d="M320 186 L346 228 L334 232 L356 268 L336 262 L348 300 L322 276 L316 296 L304 262 L308 228 Z"/>
      <path d="M222 268 L230 296 L242 284 L250 304 L256 288 L262 304 L270 284 L282 296 L290 268 Z"/>
    </g>

    <!-- head -->
    <path d="M186 168 C186 128 218 110 256 110 C294 110 326 128 326 168 L330 220
             C330 256 300 278 256 278 C212 278 182 256 182 220 Z"
          fill="url(#fur)" stroke="#1f130b" stroke-width="5" stroke-linejoin="round"/>

    <!-- forelock blowing in the wind -->
    <path d="M206 140 C214 108 246 96 272 102 C300 94 326 104 344 92 C334 110 346 118 330 130
             C318 140 304 132 296 144 C286 134 270 146 258 138 C246 148 232 138 224 150 C218 144 212 146 206 140 Z"
          fill="#4a2c17" stroke="#1f130b" stroke-width="4.5" stroke-linejoin="round"/>

    <!-- muzzle, nostrils and grin -->
    <ellipse cx="256" cy="242" rx="54" ry="34" fill="#b98159" stroke="#1f130b" stroke-width="4.5"/>
    <ellipse cx="236" cy="236" rx="7" ry="5" fill="#3b2416"/>
    <ellipse cx="276" cy="236" rx="7" ry="5" fill="#3b2416"/>
    <path d="M226 252 C240 270 272 270 288 250 C280 268 236 276 226 252 Z" fill="#7f1d1d" stroke="#1f130b" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M238 258 L272 257" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>

    <!-- sunglasses, tilted for attitude -->
    <g transform="rotate(-4 256 192)">
      <path d="M188 182 H324" stroke="#020617" stroke-width="7" stroke-linecap="round"/>
      <path d="M194 182 H248 V196 C248 212 236 218 222 218 C206 218 194 210 194 196 Z" fill="url(#lens)" stroke="#020617" stroke-width="4" stroke-linejoin="round"/>
      <path d="M264 182 H318 V196 C318 212 306 218 290 218 C276 218 264 212 264 196 Z" fill="url(#lens)" stroke="#020617" stroke-width="4" stroke-linejoin="round"/>
      <path d="M204 192 L218 186 M206 202 L230 190" stroke="#e0f2fe" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
      <path d="M274 192 L288 186 M276 202 L300 190" stroke="#e0f2fe" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
    </g>
    <!-- glint -->
    <path d="M314 172 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" fill="#ffffff"/>
  </g>

  <!-- rim -->
  <circle cx="256" cy="256" r="244" fill="none" stroke="#facc15" stroke-width="8"/>
</svg>
