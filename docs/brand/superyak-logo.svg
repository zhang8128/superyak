<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">Superyak</title>
  <desc id="d">Three super yaks in capes and sunglasses, each with a gold diamond Y, standing heroically on a jutting rock above the savanna at sunrise.</desc>
  <defs>
    <linearGradient id="cape" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset="0.5" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a4b2b"/>
      <stop offset="1" stop-color="#3b2416"/>
    </linearGradient>
    <linearGradient id="horn" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e7d6ad"/>
      <stop offset="1" stop-color="#fffaf0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef08a"/>
      <stop offset="0.5" stop-color="#facc15"/>
      <stop offset="1" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
  
    <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c1d95"/>
      <stop offset="0.38" stop-color="#db2777"/>
      <stop offset="0.62" stop-color="#f97316"/>
      <stop offset="0.86" stop-color="#fde047"/>
    </linearGradient>
    <radialGradient id="sun">
      <stop offset="0" stop-color="#fffbeb"/>
      <stop offset="0.7" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8a29e"/>
      <stop offset="0.25" stop-color="#78716c"/>
      <stop offset="1" stop-color="#44403c"/>
    </linearGradient>
    <clipPath id="badge"><circle cx="256" cy="256" r="244"/></clipPath>
    <g id="yak">
    <!-- cape, billowing right and behind -->
    <g stroke="#1f130b" stroke-width="5" stroke-linejoin="round">
      <path d="M176 266 C150 304 136 356 154 412 C170 406 182 394 194 388 Z" fill="currentColor"/>
      <path d="M314 244 C368 222 404 164 476 146 C470 178 506 202 486 234 C470 258 504 280 480 308
               C462 330 490 358 458 382 C432 400 446 428 404 434 C380 438 370 416 346 424 L322 364 Z" fill="currentColor"/>
    </g>
    <g stroke="#000000" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.25">
      <path d="M336 254 C384 232 420 196 462 176"/>
      <path d="M342 294 C392 286 430 258 470 252"/>
      <path d="M342 334 C386 336 422 326 458 332"/>
      <path d="M340 370 C374 384 402 390 432 400"/>
    </g>

    <!-- hooves: the far one a little higher -->
    <g stroke="#1f130b" stroke-width="4">
      <rect x="272" y="434" width="30" height="34" rx="6" fill="#33200f"/>
      <path d="M270 464 h34 v12 a6 6 0 0 1 -6 6 h-22 a6 6 0 0 1 -6 -6z" fill="#8b929c"/>
      <rect x="196" y="440" width="36" height="36" rx="6" fill="#3b2416"/>
      <path d="M193 472 h42 v14 a6 6 0 0 1 -6 6 h-30 a6 6 0 0 1 -6 -6z" fill="#9ca3af"/>
    </g>

    <!-- shaggy body, turned slightly left -->
    <path d="M156 300 C158 262 196 240 250 240 C306 240 346 262 350 300
             L360 330 L368 362 L358 392 L364 420 L346 412 L336 444 L318 424 L302 454 L286 428 L270 458
             L252 430 L234 460 L218 428 L202 456 L186 424 L168 446 L158 412 L138 420 L146 392 L136 362 L146 330 Z"
          fill="url(#fur)" stroke="#1f130b" stroke-width="5" stroke-linejoin="round"/>
    <g stroke="#2a190f" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7">
      <path d="M170 340 l-6 34"/><path d="M184 364 l-4 32"/><path d="M326 340 l5 32"/><path d="M314 366 l3 28"/>
    </g>

    <!-- the diamond Y, foreshortened with the turn -->
    <g transform="translate(-14 0) translate(256 340) scale(0.86 1) translate(-256 -340)">
      <path d="M216 300 H296 L320 324 L256 392 L192 324 Z" fill="url(#gold)" stroke="#b91c1c" stroke-width="6" stroke-linejoin="round"/>
      <path d="M226 310 L247 310 L256 327 L265 310 L286 310 L264 345 L264 374 L248 374 L248 345 Z"
            fill="#dc2626" stroke="#7f1d1d" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M222 306 H252" stroke="#fffbeb" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    </g>

    <!-- far horn and far ear, partly behind the head -->
    <path d="M296 150 C326 146 350 124 354 92 C356 78 350 66 340 60 C342 78 334 100 304 116 Z"
          fill="url(#horn)" stroke="#8a7a55" stroke-width="5" stroke-linejoin="round"/>
    <ellipse cx="322" cy="186" rx="18" ry="10" transform="rotate(24 322 186)" fill="#4a2c17" stroke="#1f130b" stroke-width="4.5"/>

    <!-- hair hanging past the face: the near side fuller -->
    <g fill="#4a2c17" stroke="#1f130b" stroke-width="4.5" stroke-linejoin="round">
      <path d="M312 186 L330 226 L322 230 L338 262 L324 258 L330 288 L312 268 L306 282 L298 256 L302 226 Z"/>
      <path d="M186 188 L158 230 L170 234 L146 272 L168 266 L154 304 L182 280 L188 300 L200 264 L196 228 Z"/>
      <path d="M202 268 L210 296 L222 284 L230 304 L236 288 L242 304 L250 284 L260 296 L268 268 Z"/>
    </g>

    <!-- near ear -->
    <ellipse cx="160" cy="196" rx="28" ry="14" transform="rotate(-20 160 196)" fill="#5a3622" stroke="#1f130b" stroke-width="5"/>

    <!-- head -->
    <path d="M180 170 C180 128 212 108 248 108 C284 108 312 126 316 164 L318 214
             C316 250 290 276 246 278 C204 278 174 256 174 222 Z"
          fill="url(#fur)" stroke="#1f130b" stroke-width="5" stroke-linejoin="round"/>

    <!-- near horn -->
    <path d="M198 158 C156 156 120 130 116 90 C114 70 124 54 140 48 C136 72 146 102 188 120 Z"
          fill="url(#horn)" stroke="#8a7a55" stroke-width="5" stroke-linejoin="round"/>

    <!-- forelock blowing in the wind -->
    <path d="M198 140 C206 108 238 96 264 102 C292 94 318 104 340 90 C330 108 342 116 326 128
             C314 138 300 130 292 142 C282 132 266 144 254 136 C242 146 228 136 220 148 C212 142 206 146 198 140 Z"
          fill="#4a2c17" stroke="#1f130b" stroke-width="4.5" stroke-linejoin="round"/>

    <!-- muzzle, nostrils and grin, turned toward the near side -->
    <ellipse cx="232" cy="242" rx="52" ry="34" transform="rotate(-5 232 242)" fill="#b98159" stroke="#1f130b" stroke-width="4.5"/>
    <ellipse cx="214" cy="236" rx="7" ry="5" fill="#3b2416"/>
    <ellipse cx="251" cy="234" rx="5.5" ry="4.5" fill="#3b2416"/>
    <path d="M204 252 C218 270 248 270 264 250 C256 268 214 276 204 252 Z" fill="#7f1d1d" stroke="#1f130b" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M216 258 L249 257" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>

    <!-- sunglasses: the far lens narrower, its arm running back to the ear -->
    <g transform="rotate(-6 238 192)">
      <path d="M294 184 L322 178" stroke="#020617" stroke-width="5" stroke-linecap="round"/>
      <path d="M174 182 H298" stroke="#020617" stroke-width="7" stroke-linecap="round"/>
      <path d="M178 182 H234 V196 C234 213 222 219 206 219 C190 219 178 211 178 196 Z" fill="url(#lens)" stroke="#020617" stroke-width="4" stroke-linejoin="round"/>
      <path d="M248 182 H294 V195 C294 210 284 216 271 216 C257 216 248 210 248 196 Z" fill="url(#lens)" stroke="#020617" stroke-width="4" stroke-linejoin="round"/>
      <path d="M188 192 L202 186 M190 202 L214 190" stroke="#e0f2fe" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
      <path d="M256 192 L268 187 M258 201 L278 191" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    </g>
    <!-- glint -->
    <path d="M292 168 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" fill="#ffffff"/>
    </g>
  </defs>

  <circle cx="256" cy="256" r="248" fill="#0f172a"/>
  <g clip-path="url(#badge)">
    <rect width="512" height="512" fill="url(#dawn)"/>
    <circle cx="176" cy="268" r="150" fill="url(#sun)" opacity="0.55"/>
    <circle cx="176" cy="268" r="104" fill="#fffbeb" opacity="0.9"/>
    <g fill="#fffbeb" opacity="0.9">
      <path d="M402 70 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5z"/>
      <path d="M96 104 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/>
      <path d="M456 132 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z"/>
    </g>
    <g stroke="#3b0764" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.7">
      <path d="M296 110 q8 -8 16 0 q8 -8 16 0"/>
      <path d="M340 138 q6 -6 12 0 q6 -6 12 0"/>
    </g>
    <!-- savanna and an acacia -->
    <path d="M0 418 C70 396 130 404 196 420 C262 436 320 410 512 404 V512 H0 Z" fill="#9a3412" opacity="0.85"/>
    <path d="M0 452 C90 434 170 446 250 458 C330 470 420 446 512 450 V512 H0 Z" fill="#7c2d12"/>
    <g fill="#431407">
      <path d="M118 470 L124 428 L129 428 L128 470 Z"/>
      <path d="M126 432 L146 418 L148 421 L130 434 Z"/>
      <path d="M86 428 C100 414 152 412 170 426 C154 434 104 436 86 428 Z"/>
    </g>
    <!-- the rock, rising behind the ledge -->
    <path d="M100 342 L118 334 L236 332 L262 312 L290 290 L370 286 L398 264 L420 252 L480 248 L520 244 V520 H300 L312 444 L292 396 L232 370 L152 362 Z"
          fill="url(#rock)" stroke="#1c1917" stroke-width="5" stroke-linejoin="round"/>
    <path d="M100 342 L152 362 L232 370 L292 396 L312 444 L300 520 H350 L350 436 L326 388 Z" fill="#292524" opacity="0.55"/>
    <path d="M120 336 L236 334 M290 290 L370 286 M420 252 L480 248 L520 244" stroke="#e7e5e4" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7"/>
    <g stroke="#292524" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6">
      <path d="M380 320 l-14 36 l10 22"/><path d="M452 300 l8 40"/><path d="M262 352 l-20 14"/><path d="M330 310 l6 26"/>
    </g>
    <!-- three super yaks: the far one higher, the leader on the tip -->
    <use href="#yak" transform="translate(230 91) scale(0.4)" color="#0d9488"/>
    <use href="#yak" transform="translate(355 83) scale(0.34)" color="#1d4ed8"/>
    <use href="#yak" transform="translate(48 100) scale(0.48)" color="#ef4444"/>
  </g>
  <circle cx="256" cy="256" r="244" fill="none" stroke="#facc15" stroke-width="8"/>
</svg>
