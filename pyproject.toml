[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "engram"
version = "0.3.0"
description = "Layered memory plugin for Claude Code"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.9",
    "sqlite-vec>=0.1.6",
    "onnxruntime>=1.18",
    "fastembed>=0.7",
    "tree-sitter>=0.24",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "watchfiles>=1.0",
    "scipy>=1.14",
]

[project.optional-dependencies]
dev = ["pytest"]
llm = ["anthropic"]

[tool.setuptools]
py-modules = ["server", "storage", "embeddings", "compress", "reflection", "indexer", "config", "logging_config", "watcher", "dedup"]

[tool.pytest.ini_options]
pythonpath = ["."]
